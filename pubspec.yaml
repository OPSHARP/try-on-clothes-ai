name: try_on_clothes_ai
description: "AI-powered virtual fitting room application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Networking
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.4

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  smooth_page_indicator: ^1.2.0+3
  flutter_animate: ^4.5.2
  iconsax_flutter: ^1.0.0+1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  photo_view: ^0.15.0
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.3.1

  # In-App Purchase
  in_app_purchase: ^3.2.1
  in_app_purchase_android: ^0.5.3

  # In-App Update (Play Core Flexible Updates)
  in_app_update: ^4.2.5

  # AdMob
  google_mobile_ads: ^9.2.0
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/presets/
    - assets/icons/
